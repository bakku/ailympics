<text x="40" y="62" fill="#314c49" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="2.8">A FAMILY, A HOUSE, A HUNDRED WINTERS</text>
<text x="39" y="465" fill="#f0eee2" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.4">
