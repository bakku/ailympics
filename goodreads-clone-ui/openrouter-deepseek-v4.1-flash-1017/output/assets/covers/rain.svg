  <path d="M76 167l-11 38M118 193l-16 57M164 163l-9 29M237 178l-18 51M280 153l-10 34M326 202l-14 45M89 312l-13 44M140 298l-9 30M188 341l-16 52M255 305l-12 37M309 333l-16 49M350 291l-9 29"/>
