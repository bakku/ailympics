<g fill="#d0a557">
  <circle cx="74" cy="460" r="5"/><circle cx="137" cy="474" r="2.5"/><circle cx="213" cy="463" r="3.5"/><circle cx="303" cy="480" r="5"/><circle cx="342" cy="453" r="2.5"/>
