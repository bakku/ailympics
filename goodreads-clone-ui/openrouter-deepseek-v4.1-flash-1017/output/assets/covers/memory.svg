<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
<title>The Memory Thief</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
  </filter>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".18"/>
    <stop offset=".018" stop-color="#000" stop-opacity=".08"/>
    <stop offset=".06" stop-color="#fff" stop-opacity=".05"/>
    <stop offset=".12" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="400" height="600" fill="#34223d"/>
<g opacity=".9">
  <rect x="66" y="168" width="158" height="194" rx="2" fill="#d9c7ad" transform="rotate(-7 66 168)"/>
  <rect x="184" y="213" width="151" height="185" rx="2" fill="#a86756" transform="rotate(8 184 213)"/>
  <rect x="113" y="251" width="157" height="190" rx="2" fill="#6a8290" transform="rotate(-2 113 251)"/>
</g>
<g fill="none" stroke="#e9dac4" stroke-width="1" opacity=".7">
  <circle cx="192" cy="338" r="30"/>
  <path d="M192 292v-15M192 399v-15M146 338h-15M253 338h-15M162 308l-11-11M233 379l-11-11M222 308l11-11M151 379l11-11"/>
</g>
<path d="M192 337c-11-11-30-4-30 11 0 16 30 28 30 28s30-12 30-28c0-15-19-22-30-11Z" fill="#d4a65b" opacity=".9"/>
<g fill="#d9c7ad" opacity=".35">
  <circle cx="91" cy="407" r="2"/><circle cx="304" cy="427" r="1.3"/><circle cx="345" cy="143" r="1.6"/><circle cx="61" cy="117" r="1.2"/>
</g>
<text x="40" y="66" fill="#dcc9b2" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="3">A NOVEL</text>
<text x="39" y="522" fill="#f1e4d2" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="-.5">
  <tspan x="39" y="520">The Memory</tspan><tspan x="39" y="566" font-style="italic">Thief</tspan>
</text>
<text x="40" y="588" fill="#c3afa7" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.4">DANIEL OKONKWO</text>

<rect width="400" height="600" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>
<rect width="400" height="600" fill="url(#spine)"/>
</svg>