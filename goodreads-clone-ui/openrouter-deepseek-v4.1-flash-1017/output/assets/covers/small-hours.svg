<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
<title>Small Hours</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
