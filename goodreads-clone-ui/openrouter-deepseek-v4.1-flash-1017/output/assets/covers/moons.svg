<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
<title>Paper Moons</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
  </filter>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".18"/>
    <stop offset=".018" stop-color="#000" stop-opacity=".08"/>
    <stop offset=".06" stop-color="#fff" stop-opacity=".05"/>
    <stop offset=".12" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="400" height="600" fill="#101c30"/>
<g opacity=".75" fill="#e7d9b6">
  <circle cx="62" cy="101" r="1"/><circle cx="117" cy="72" r="1.5"/><circle cx="331" cy="88" r="1"/><circle cx="366" cy="158" r="1.5"/><circle cx="278" cy="122" r="1"/><circle cx="69" cy="219" r="1.2"/><circle cx="351" cy="276" r="1"/>
</g>
<circle cx="198" cy="283" r="92" fill="#ece1c6"/>
<circle cx="198" cy="283" r="78" fill="#101c30" opacity=".25"/>
<circle cx="133" cy="375" r="52" fill="#d7a958"/>
<circle cx="282" cy="210" r="37" fill="#9fb8b2"/>
<circle cx="289" cy="371" r="19" fill="#c56e50"/>
<g fill="none" stroke="#e7d9b6" stroke-width=".8" opacity=".4">
  <path d="M0 489h400M0 518h400M40 580V460M123 580V460M206 580V460M289 580V460M372 580V460"/>
</g>
<text x="41" y="63" fill="#e7d9b6" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="3">A NOVEL IN THREE ORBITS</text>
<text x="40" y="480" fill="#f2ead7" font-family="Georgia, 'Times New Roman', serif" font-size="55" letter-spacing="-.8">Paper Moons</text>
<text x="41" y="568" fill="#aebfba" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.4">KENJI SATO</text>

<rect width="400" height="600" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>
<rect width="400" height="600" fill="url(#spine)"/>
</svg>