<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
<title>The Nightingale's Atlas</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
  </filter>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".18"/>
    <stop offset=".018" stop-color="#000" stop-opacity=".08"/>
    <stop offset=".06" stop-color="#fff" stop-opacity=".05"/>
    <stop offset=".12" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="400" height="600" fill="#15243a"/>
<g fill="none" stroke="#c9a867" stroke-width=".7" opacity=".35">
  <ellipse cx="200" cy="286" rx="178" ry="92" transform="rotate(-18 200 286)"/>
  <ellipse cx="200" cy="286" rx="146" ry="135" transform="rotate(17 200 286)"/>
  <ellipse cx="200" cy="286" rx="80" ry="173" transform="rotate(-4 200 286)"/>
  <path d="M22 286h356M200 101v370"/>
</g>
<path d="M123 323c18-44 65-78 112-83 22-2 37 10 32 27-8 25-49 41-83 41 28 12 57 16 86 9-15 15-36 23-61 24l-9 26-9-27c-27-1-50-6-68-17Z" fill="#d4b474"/>
<g fill="#d4b474">
  <circle cx="111" cy="176" r="2.2"/><circle cx="286" cy="143" r="1.6"/><circle cx="339" cy="224" r="2"/><circle cx="303" cy="370" r="1.6"/><circle cx="98" cy="398" r="1.3"/>
</g>
<path d="M111 176l28 17 33-5 29 25 33 4 26 23M90 398l33-22 31 3 27-19" stroke="#c9a867" stroke-width=".7" opacity=".55"/>
<text x="42" y="62" fill="#c9a867" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="3">BEING A CARTOGRAPHY OF SONG</text>
<text x="41" y="473" fill="#ecd9b5" font-family="Georgia, 'Times New Roman', serif" font-size="41" letter-spacing="-.3">
  <tspan x="41" y="470">The Nightingale's</tspan><tspan x="41" y="515" font-style="italic">Atlas</tspan>
</text>
<text x="42" y="573" fill="#93a9b2" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.4">A. S. VALE</text>

<rect width="400" height="600" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>
<rect width="400" height="600" fill="url(#spine)"/>
</svg>