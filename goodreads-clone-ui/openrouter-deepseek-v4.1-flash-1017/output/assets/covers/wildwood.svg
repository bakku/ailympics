<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
<title>Wildwood Almanac</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
  </filter>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".18"/>
    <stop offset=".018" stop-color="#000" stop-opacity=".08"/>
    <stop offset=".06" stop-color="#fff" stop-opacity=".05"/>
    <stop offset=".12" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="400" height="600" fill="#a64f35"/>
<circle cx="331" cy="112" r="43" fill="#e7d4ae" opacity=".92"/>
<g fill="none" stroke="#f0dfbe" stroke-width="1.4" opacity=".9">
  <path d="M198 502c-3-105 9-197 46-280M202 441c-29-8-58-36-62-71 32 2 55 21 65 47M205 370c35-13 56-40 58-74-32 4-54 24-62 51M213 316c-31-4-58-26-64-55 29-2 54 13 64 37M244 231c26-9 41-31 40-56-25 5-41 22-45 43"/>
  <path d="M202 442c-19 1-41-5-62-18 15 22 33 32 56 35M206 371c26 10 49 6 68-11-24-7-45-4-61 7M214 318c-10-19-28-32-49-37 3 23 16 38 39 44M245 232c-7-17-4-35 6-49 9 17 10 33 3 46"/>
</g>
<g fill="none" stroke="#f0dfbe" stroke-width="1">
  <circle cx="200" cy="307" r="144" opacity=".35"/><circle cx="200" cy="307" r="133" opacity=".18"/>
</g>
<text x="40" y="64" fill="#f1dfbd" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="2.7">NOTES FROM THE EDGE OF THE WOODS</text>
<text x="39" y="524" fill="#f7ead2" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="-.5">
  <tspan x="39" y="520">Wildwood</tspan><tspan x="39" y="567" font-style="italic">Almanac</tspan>
</text>
<text x="40" y="586" fill="#f1dfbd" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.4">ROWAN ELLIS</text>

<rect width="400" height="600" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>
<rect width="400" height="600" fill="url(#spine)"/>
