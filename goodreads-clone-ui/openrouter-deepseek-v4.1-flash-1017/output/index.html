<!doctype html>
<html lang="en" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Marginalia — a warm, self-hosted reading room for the books you love and the people you read with.">
  <meta name="theme-color" content="#202a23">
  <title>Marginalia — The reading room</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

    <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="Marginalia — the reading room — home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M9 10.5c7.5 0 11 2.5 11 8.5v12c-2.2-2.2-5.4-3.3-11-3.3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M31 10.5c-7.5 0-11 2.5-11 8.5v12c2.2-2.2 5.4-3.3 11-3.3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 14.5c2.6.2 4.5.9 5.6 2M27 14.5c-2.6.2-4.5.9-5.6 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">Marginalia</span>
          <span class="brand-tagline">the reading room</span>
        </span>
      </a>

      <button class="sidebar-add" type="button" data-add-book title="Log a book">
        <svg class="icon"><use href="#i-plus"/></svg>
        <span>Log a book</span>
        <kbd aria-hidden="true">N</kbd>
      </button>

      <nav class="primary-nav" aria-label="Discover">
        <p class="nav-heading">Discover</p>
        <a class="nav-link" href="#home" data-route="home" title="Home">
          <svg class="icon"><use href="#i-home"/></svg><span>Home</span>
        </a>
        <a class="nav-link" href="#shelves" data-route="shelves" title="My books">
          <svg class="icon"><use href="#i-books"/></svg><span>My books</span><span class="nav-count" data-nav-total>16</span>
        </a>
        <a class="nav-link" href="#browse" data-route="browse" title="Browse">
          <svg class="icon"><use href="#i-compass"/></svg><span>Browse</span>
        </a>
        <a class="nav-link" href="#community" data-route="community" title="The reading room">
          <svg class="icon"><use href="#i-users"/></svg><span>The reading room</span><span class="nav-pip"></span>
        </a>
        <a class="nav-link" href="#stats" data-route="stats" title="Reading stats">
          <svg class="icon"><use href="#i-chart"/></svg><span>Reading stats</span>
        </a>
      </nav>

      <div class="shelf-shortcuts" aria-label="Your shelves">
        <p class="nav-heading">Your shelves</p>
        <a href="#shelves" data-shelf-jump="want">
          <span class="shelf-dot shelf-dot--want"></span><span>Want to read</span><span class="shelf-count" data-shelf-count="want">6</span>
        </a>
        <a href="#shelves" data-shelf-jump="reading">
          <span class="shelf-dot shelf-dot--reading"></span><span>Reading</span><span class="shelf-count" data-shelf-count="reading">2</span>
        </a>
        <a href="#shelves" data-shelf-jump="read">
          <span class="shelf-dot shelf-dot--read"></span><span>Read</span><span class="shelf-count" data-shelf-count="read">8</span>
        </a>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-footer">
        <div class="server-status" title="Your instance is running locally">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Self-hosted</span>
          <span class="server-version">v0.9.2</span>
        </div>
        <button class="sidebar-account" type="button" data-profile-trigger>
          <img src="assets/avatars/maya.svg" alt="" class="avatar avatar--sm">
          <span class="account-copy"><strong>Maya Chen</strong><span>@maya</span></span><span class="sr-only">Open account menu</span>
          <svg class="icon account-chevron"><use href="#i-more"/></svg>
        </button>
      </div>
    </aside>

    <header class="mobile-header">
      <a class="brand brand--mobile" href="#home" aria-label="Marginalia home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M9 10.5c7.5 0 11 2.5 11 8.5v12c-2.2-2.2-5.4-3.3-11-3.3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M31 10.5c-7.5 0-11 2.5-11 8.5v12c2.2-2.2 5.4-3.3 11-3.3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 14.5c2.6.2 4.5.9 5.6 2M27 14.5c-2.6.2-4.5.9-5.6 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">Marginalia</span>
      </a>
      <div class="mobile-header-actions">
        <button class="icon-button" type="button" data-open-search aria-label="Search books">
          <svg class="icon"><use href="#i-search"/></svg>
        </button>
        <button class="icon-button" type="button" data-add-book aria-label="Log a book">
          <svg class="icon"><use href="#i-plus"/></svg>
        </button>
        <button class="icon-button" type="button" data-profile-trigger aria-label="Open account menu">
          <img src="assets/avatars/maya.svg" alt="" class="avatar avatar--xs">
        </button>
      </div>
    </header>

    <div class="main-shell">
      <header class="topbar">
        <button class="search-trigger" type="button" data-open-search>
          <svg class="icon"><use href="#i-search"/></svg>
          <span>Search books, authors, lists…</span>
          <kbd><span class="cmd-key">⌘</span> K</kbd>
        </button>
        <div class="topbar-actions">
          <button class="icon-button notification-button" type="button" data-notifications aria-label="Notifications, 3 unread" aria-expanded="false" aria-controls="notification-popover">
            <svg class="icon"><use href="#i-bell"/></svg>
            <span class="notification-dot"></span>
          </button>
          <button class="btn btn--primary btn--sm topbar-add" type="button" data-add-book>
            <svg class="icon"><use href="#i-plus"/></svg><span>Log a book</span>
          </button>
          <button class="profile-chip" type="button" data-profile-trigger aria-label="Open account menu" aria-expanded="false">
            <img src="assets/avatars/maya.svg" alt="" class="avatar avatar--sm">
            <svg class="icon"><use href="#i-chevron-down"/></svg>
          </button>
        </div>
      </header>

      <main class="main-content" id="main">
        <div id="app-root" tabindex="-1"></div>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Mobile navigation">
      <a href="#home" data-route="home" class="bottom-nav-link">
        <svg class="icon"><use href="#i-home"/></svg><span>Home</span>
      </a>
      <a href="#shelves" data-route="shelves" class="bottom-nav-link">
        <svg class="icon"><use href="#i-books"/></svg><span>My books</span>
      </a>
      <a href="#browse" data-route="browse" class="bottom-nav-link">
        <svg class="icon"><use href="#i-compass"/></svg><span>Browse</span>
      </a>
      <a href="#community" data-route="community" class="bottom-nav-link">
        <svg class="icon"><use href="#i-users"/></svg><span>Community</span>
      </a>
      <a href="#stats" data-route="stats" class="bottom-nav-link">
        <svg class="icon"><use href="#i-chart"/></svg><span>Stats</span>
      </a>
    </nav>
  </div>

  <div class="popover notifications-popover" id="notification-popover" role="dialog" aria-label="Notifications" hidden></div>
  <div class="popover profile-popover" id="profile-popover" role="dialog" aria-label="Account menu" hidden></div>

  <div class="modal-layer search-layer" id="search-layer" aria-hidden="true">
    <div class="modal-scrim" data-close-layer="search-layer"></div>
    <section class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-dialog-title">
      <h2 class="sr-only" id="search-dialog-title">Search Marginalia</h2>
      <div class="search-input-wrap">
        <svg class="icon search-input-icon"><use href="#i-search"/></svg>
        <input id="search-input" type="text" autocomplete="off" placeholder="Search by title, author, or genre…" aria-label="Search by title, author, or genre" aria-controls="search-results">
        <kbd>ESC</kbd>
        <button class="icon-button search-close" type="button" data-close-layer="search-layer" aria-label="Close search">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="search-body">
        <div id="search-results"></div>
      </div>
      <div class="search-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> to move</span>
        <span><kbd>↵</kbd> to open</span>
        <span class="search-scope">16 books in your library</span>
      </div>
    </section>
  </div>

  <div class="modal-layer" id="book-layer" aria-hidden="true"></div>
  <div class="modal-layer" id="progress-layer" aria-hidden="true"></div>
  <div class="modal-layer" id="add-book-layer" aria-hidden="true"></div>
  <div class="modal-layer" id="composer-layer" aria-hidden="true"></div>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
